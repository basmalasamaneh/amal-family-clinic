        },
        "examples": [{ "name": "Synthetic patient updated" }]
      },
      "AppointmentAvailability": {
        "type": "object",
        "additionalProperties": false,
        "required": ["items", "durationMinutes", "checkedAt"],
        "properties": {
          "items": {
            "type": "array",
            "items": {
              "type": "object",
              "additionalProperties": false,
              "required": ["doctorId", "startsAt", "endsAt"],
              "properties": {
