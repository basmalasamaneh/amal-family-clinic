      "ConflictItem": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "type": {
            "type": "string",
            "enum": [
              "doctor-overlap",
              "patient-overlap",
              "same-day-other-clinic",
              "outside-hours",
              "slot-held"
            ]
          },
          "with": {
            "oneOf": [
              {
                "type": "object",
                "additionalProperties": false,
                "properties": {
                  "appointmentId": {
                    "type": "integer",
                    "minimum": 1
                  },
                  "clinicId": {
                    "type": "integer",
