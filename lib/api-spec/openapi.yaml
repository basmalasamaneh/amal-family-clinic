      "ConflictPreview": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "ok": {
            "type": "boolean"
          },
          "conflicts": {
            "type": "array",
            "items": {
              "$ref": "#/components/schemas/ConflictItem"
            }
          }
        },
        "required": [
          "ok",
          "conflicts"
        ],
        "examples": [
          {
            "ok": false,
            "conflicts": [
              {
                "type": "doctor-overlap",
                "with": {
                  "appointmentId": 402,
                  "clinicId": 101
                },
                "severity": "blocking",
                "suggestedSlots": [
                  {
                    "startsAt": "2026-09-09T08:00:00Z",
                    "endsAt": "2026-09-09T08:15:00Z"
                  }
                ]
              }
            ]
          }
        ],
        "description": "Exactly {ok, conflicts}. ok means committing is permitted by current rules, not a reservation. Blocking conflicts always prevent writes. Patient warnings require an authorized nonblank overrideReason. Information alone never blocks. Preview has no appointment/audit writes."
      },
