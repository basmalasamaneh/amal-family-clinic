{
  "openapi": "3.1.0",
  "info": {
    "title": "Api",
    "version": "0.2.0",
    "description": "Amal Network Section 12. Authentication, appointments and clinic-local patient CRUD/search are implemented; other domain services remain contracts/mocks. UTC ISO instants, required date-only DOB, Asia/Hebron display. Local patient endpoints return demographics only to doctors/front-desk, never clinical history or admin patient access. Separate network services require consent and exclude Lite clinics. Lists use opaque cursor plus limit (1–100, default 25); null nextCursor ends pagination. Administration endpoints are implemented against operational tables, with account deactivation and transactional audit. Network health reports persisted receipt-time telemetry with explicit unknown queue coverage."
  },
  "servers": [
    {
      "url": "/api"
    }
  ],
  "components": {
    "securitySchemes": {
      "sessionCookie": {
        "type": "apiKey",
        "in": "cookie",
        "name": "amal_session",
        "description": "Opaque server-side session. HttpOnly Secure SameSite=Strict. Doctor/admin idle 30 minutes; reception absolute 8 hours."
      },
      "deviceCookie": {
        "type": "apiKey",
        "in": "cookie",
        "name": "amal_device",
        "description": "Registered reception device opaque credential; provisioned only by admin. Never a submitted device ID."
      },
      "csrfToken": {
        "type": "apiKey",
        "in": "header",
        "name": "X-CSRF-Token",
        "description": "Use Identity.csrfToken for authenticated mutations."
      }
    },
    "schemas": {
      "ReminderClinicPreference": {
        "type": "object", "additionalProperties": false, "required": ["enabled"],
        "properties": { "enabled": { "type": "boolean" } }
      },
      "ReminderPatientPreference": {
        "type": "object", "additionalProperties": false, "required": ["optedOut"],
        "properties": { "optedOut": { "type": "boolean" } }
      },
      "ReminderLogEntry": {
        "type": "object", "additionalProperties": false,
        "required": ["id", "status", "textAr", "textEn", "scheduledAt", "sentAt", "cancelledAt", "cancellationReason"],
        "properties": {
          "id": { "type": "integer" },
          "status": { "type": "string", "enum": ["scheduled", "sent", "cancelled"] },
          "textAr": { "type": "string" }, "textEn": { "type": "string" },
          "scheduledAt": { "type": "string", "format": "date-time" },
          "sentAt": { "type": ["string", "null"] },
          "cancelledAt": { "type": ["string", "null"] },
          "cancellationReason": { "type": ["string", "null"] }
        }
      },
      "ReminderLog": {
        "type": "object", "additionalProperties": false, "required": ["items", "nextCursor"],
        "properties": {
          "items": { "type": "array", "items": { "$ref": "#/components/schemas/ReminderLogEntry" } },
          "nextCursor": { "type": ["integer", "null"] }
        }
      },
      "DemoContext": {
        "type": "object", "additionalProperties": false,
        "required": ["enabled", "generation", "clinicId", "outage"],
        "properties": {
          "enabled": {"type": "boolean"},
          "generation": {"type": ["string", "null"]},
          "clinicId": {"type": ["integer", "null"]},
          "outage": {"type": "boolean"}
        }
      },
      "DeveloperClinic": {
        "type": "object", "additionalProperties": false,
        "required": ["id", "name", "outage"],
        "properties": {"id": {"type": "integer"}, "name": {"type": "string"}, "outage": {"type": "boolean"}}
      },
      "DeveloperStatus": {
        "type": "object", "additionalProperties": false,
        "required": ["generation", "clinics"],
        "properties": {"generation": {"type": "string"}, "clinics": {"type": "array", "items": {"$ref": "#/components/schemas/DeveloperClinic"}}}
      },
      "DeveloperOutageInput": {
        "type": "object", "additionalProperties": false,
        "required": ["enabled", "expectedGeneration"],
        "properties": {"enabled": {"type": "boolean"}, "expectedGeneration": {"type": "string", "format": "uuid"}}
      },
      "DemoResetInput": {
        "type": "object", "additionalProperties": false,
        "required": ["requestId", "expectedGeneration", "confirmation"],
        "properties": {
          "requestId": {"type": "string", "format": "uuid"},
          "expectedGeneration": {"type": "string", "format": "uuid"},
          "confirmation": {"type": "string", "enum": ["RESET-OPERATIONAL-DEMO-DATA"]}
        }
      },
      "DemoResetReceipt": {
        "type": "object", "additionalProperties": false,
        "required": ["requestId", "previousGeneration", "generation", "completedAt", "reauthenticationRequired"],
        "properties": {
          "requestId": {"type": "string"}, "previousGeneration": {"type": "string"},
          "generation": {"type": "string"}, "completedAt": {"type": "string"},
          "reauthenticationRequired": {"type": "boolean"}
        }
      },
      "AdoptionResultMetric": {
        "type": "object", "additionalProperties": false,
        "required": ["available", "reason", "value", "units", "sampleCount", "coverage", "provenance"],
        "properties": {
          "available": { "type": "boolean" },
          "reason": { "type": ["string", "null"], "enum": [null, "NO_PREVENTION_EVIDENCE", "NO_LOOKUP_SAMPLES"] },
          "value": { "type": ["number", "null"], "minimum": 0, "description": "Null when unavailable; observed zero remains numeric zero." },
          "units": { "type": "string", "enum": ["blocks", "seconds"] },
          "sampleCount": { "type": "integer", "minimum": 0 },
          "coverage": { "type": "string" },
          "provenance": { "type": "string" }
        }
      },
      "AdoptionResults": {
        "type": "object", "additionalProperties": false,
        "required": ["available", "reason", "window", "generatedAt", "calculationVersion", "clinics"],
        "description": "Intentionally published scalar summary only. Configuration authorizes disclosure independently of clinical sharing consent. available refers to configuration resolution; each metric has independent evidence availability. No trial clinic identity, event, patient or doctor detail. No clinical sharing permission or adoption mutation is implied.",
        "properties": {
          "available": { "type": "boolean" },
          "reason": { "type": ["string", "null"], "enum": [null, "SCENARIO_UNCONFIGURED", "SCENARIO_CLINICS_UNAVAILABLE"] },
          "window": { "$ref": "#/components/schemas/KpiPeriod" },
          "generatedAt": { "type": "string", "format": "date-time" },
          "calculationVersion": { "type": "string" },
          "clinics": {
            "type": "array", "maxItems": 2,
            "description": "Exactly two configured result clinics in configuration order when available; empty otherwise. Names are operational data, never used for resolution.",
            "items": {
              "type": "object", "additionalProperties": false,
              "required": ["clinicId", "clinicName", "preventedBlocks", "medianLookupSeconds"],
              "properties": {
                "clinicId": { "type": "integer", "minimum": 1, "maximum": 2147483647 },
                "clinicName": { "type": "string" },
                "preventedBlocks": { "$ref": "#/components/schemas/AdoptionResultMetric" },
                "medianLookupSeconds": { "$ref": "#/components/schemas/AdoptionResultMetric" }
              }
            }
          }
        }
      },
      "OfflinePermit": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "payload",
          "signature",
          "publicKey"
        ],
        "properties": {
          "payload": {
            "type": "string",
            "description": "base64url JSON signed claims: version=1, audience=amal-offline-tab, tab nonce, account userId, display name, doctor/front-desk role, single clinic id/name, issuedAt/expiresAt UTC milliseconds. Maximum lifetime 30 minutes and never beyond authenticated session expiry."
          },
          "signature": {
            "type": "string",
            "description": "base64url ECDSA P-256 SHA-256 signature, IEEE P1363 encoding, over UTF-8 payload."
          },
          "publicKey": {
            "type": "string",
            "description": "base64url SPKI P-256 verification key pinned by this authenticated HTTPS exchange. Public, never a login credential."
          }
        }
      },
      "SyncDeviceState": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "deviceId",
          "nextSequence"
        ],
        "properties": {
          "deviceId": {
            "type": "integer",
            "minimum": 1
          },
          "nextSequence": {
            "type": "integer",
            "minimum": 1
          }
        }
      },
      "ReceptionContext": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "clinic"
        ],
        "properties": {
          "clinic": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "id",
              "name"
            ],
            "properties": {
              "id": {
                "type": "integer",
                "minimum": 1
              },
              "name": {
                "type": "string"
              }
            }
          }
        },
        "examples": [
          {
            "clinic": {
              "id": 101,
              "name": "Synthetic demonstration clinic"
            }
          }
        ]
      },
      "HealthStatus": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "status": {
            "type": "string"
          }
        },
        "required": [
          "status"
        ],
        "examples": [
          {
            "status": "ok"
          }
        ]
      },
      "ApiFailure": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "code": {
            "type": "string"
          },
          "messageKey": {
            "type": "string"
          },
          "params": {
            "type": "object",
            "additionalProperties": {
              "oneOf": [
                {
                  "type": "string"
                },
                {
                  "type": "number"
                },
                {
                  "type": "boolean"
                }
              ]
            }
          }
        },
        "required": [
          "code",
          "messageKey",
          "params"
        ],
        "examples": [
          {
            "code": "VALIDATION",
            "messageKey": "error.validation",
            "params": {}
          }
        ]
      },
      "Clinic": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "adoption": { "$ref": "#/components/schemas/ClinicAdoption" },
          "id": {
            "type": "integer",
            "minimum": 1
          },
          "name": {
            "type": "string"
          },
          "mode": {
            "type": "string",
            "enum": [
              "network",
              "lite"
            ]
          },
          "timezone": {
            "type": "string",
            "description": "IANA timezone; source workbook instants interpreted as Asia/Hebron exactly once."
          }
        },
        "required": [
          "id",
          "name",
          "mode",
          "timezone"
        ],
        "examples": [
          {
            "id": 101,
            "name": "Synthetic demonstration clinic",
            "mode": "network",
            "timezone": "Asia/Hebron"
          }
        ]
      },
      "ClinicInput": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
