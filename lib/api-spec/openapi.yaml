                "startsAt": { "type": "string", "format": "date-time" },
                "endsAt": { "type": "string", "format": "date-time" }
              }
            }
          },
          "durationMinutes": { "type": "integer", "minimum": 1, "maximum": 1440 },
          "checkedAt": { "type": "string", "format": "date-time" }
        },
        "examples": [{
          "items": [{"doctorId": 201, "startsAt": "2026-09-09T07:00:00Z", "endsAt": "2026-09-09T07:15:00Z"}],
          "durationMinutes": 15,
          "checkedAt": "2026-09-09T06:59:00Z"
        }]
      },
      "PatientInput": {
        "type": "object",
        "additionalProperties": false,
        "description": "Registration uses completed birthdays on the current Asia/Hebron calendar date. Under 18 requires both guardian fields. Adult guardian values are discarded; guardian demographics never grant consent.",
        "properties": {
          "guardianName": { "type": "string", "minLength": 1, "maxLength": 200, "pattern": "\\S" },
          "guardianRelation": { "type": "string", "minLength": 1, "maxLength": 100, "pattern": "\\S" },
          "name": {
            "type": "string",
            "minLength": 1,
            "maxLength": 200
          },
          "dateOfBirth": {
            "type": "string",
            "format": "date"
          },
          "phone": {
            "type": "string",
            "minLength": 1,
            "maxLength": 40
          },
          "clientOpId": {
            "type": "string",
            "format": "uuid"
          }
        },
        "required": [
          "name",
          "dateOfBirth",
          "phone",
          "clientOpId"
