        "examples": [
          {
            "name": "Synthetic patient",
            "dateOfBirth": "1990-05-12",
            "phone": "+970599000001",
            "clientOpId": "00000000-0000-4000-8000-000000000001"
          }
        ]
      },
      "AppointmentInput": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
