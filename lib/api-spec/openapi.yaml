    "/patients/{id}/access-history": {
      "post": {
        "operationId": "readPatientAccessHistory",
        "tags": [
          "patients"
        ],
        "summary": "Read patient-requested access history with reception assistance",
        "description": "Front-desk only. Requires authenticated trusted device, CSRF header and fresh PIN; repeats current server clinic patient scope and explicit patient-request confirmation on every page. Not a patient account or general reception audit feed. Only successful cross-clinic network.lookup disclosures for this selected operational patient are projected; no raw details or other patient data. Default 25, max 100, newest first. Signed cursor binds actor, clinic, patient and trusted device using a stable server-only secret, survives PIN reauthentication session rotation on the same device, and confers no authorization. Each successful read is itself minimally audited. Private no-store.",
        "security": [
          {
            "sessionCookie": []
          }
        ],
        "x-roles": [
          "front-desk"
        ],
        "x-implementation": "implemented",
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 2147483647
            },
            "example": 301
          },
          {
            "name": "X-CSRF-Token",
            "in": "header",
            "required": true,
            "schema": {
              "type": "string"
            },
            "example": "session-csrf-token"
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/PatientAccessHistoryInput"
              },
              "example": {
                "patientRequestConfirmed": true,
                "limit": 25
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Minimal scoped access history",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/PatientAccessHistoryPage"
                },
                "example": {
                  "items": [
                    {
                      "id": 501,
                      "at": "2026-06-11T10:00:00Z",
                      "viewerName": null,
                      "viewerRole": null,
                      "viewerClinicName": null,
                      "action": "patient-view"
                    }
                  ],
                  "nextCursor": null
                }
              }
            }
          },
          "400": {
            "description": "Invalid body, missing confirmation or invalid/context-mismatched cursor"
          },
          "401": {
            "description": "Authenticated trusted-device session required"
          },
          "403": {
            "description": "Front-desk, CSRF and fresh PIN required (REAUTH_REQUIRED when PIN stale)"
          },
          "404": {
            "description": "Patient absent, merged or outside current clinic scope"
          }
        }
      }
    },
