          "with",
          "severity",
          "suggestedSlots"
        ],
        "examples": [
          {
            "type": "doctor-overlap",
            "with": {
              "appointmentId": 402,
              "clinicId": 101
            },
            "severity": "blocking",
            "suggestedSlots": [
              {
                "startsAt": "2026-09-09T08:00:00Z",
                "endsAt": "2026-09-09T08:15:00Z"
              }
            ]
          }
        ]
