              "changedAt": "2026-01-01T00:00:00.000Z", "trialStartedAt": "2026-01-01T00:00:00.000Z",
              "liteStartedAt": "2026-01-01T00:00:00.000Z", "fullStartedAt": null, "leftAt": null, "leftBy": null,
