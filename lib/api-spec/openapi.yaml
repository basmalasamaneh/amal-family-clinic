{
  "openapi": "3.1.0",
  "info": {
    "title": "Api",
    "version": "0.2.0",
    "description": "Amal Network Section 12. Authentication, appointments and clinic-local patient CRUD/search are implemented; other domain services remain contracts/mocks. UTC ISO instants, required date-only DOB, Asia/Hebron display. Local patient endpoints return demographics only to doctors/front-desk, never clinical history or admin patient access. Separate network services require consent and exclude Lite clinics. Lists use opaque cursor plus limit (1–100, default 25); null nextCursor ends pagination."
  },
  "servers": [
    {
      "url": "/api"
    }
  ],
  "components": {
    "securitySchemes": {
      "sessionCookie": {
        "type": "apiKey",
        "in": "cookie",
        "name": "amal_session",
        "description": "Opaque server-side session. HttpOnly Secure SameSite=Strict. Doctor/admin idle 30 minutes; reception absolute 8 hours."
      },
      "deviceCookie": {
        "type": "apiKey",
        "in": "cookie",
        "name": "amal_device",
        "description": "Registered reception device opaque credential; provisioned only by admin. Never a submitted device ID."
      },
      "csrfToken": {
        "type": "apiKey",
        "in": "header",
        "name": "X-CSRF-Token",
        "description": "Use Identity.csrfToken for authenticated mutations."
      }
    },
    "schemas": {
      "ReceptionContext": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "clinic"
        ],
        "properties": {
          "clinic": {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "id",
              "name"
            ],
            "properties": {
              "id": {
                "type": "integer",
                "minimum": 1
              },
              "name": {
                "type": "string"
              }
            }
          }
        },
        "examples": [
          {
            "clinic": {
              "id": 101,
              "name": "Synthetic demonstration clinic"
            }
          }
        ]
      },
      "HealthStatus": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "status": {
            "type": "string"
          }
        },
        "required": [
          "status"
        ],
        "examples": [
          {
            "status": "ok"
          }
        ]
      },
      "ApiFailure": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "code": {
            "type": "string"
          },
          "messageKey": {
            "type": "string"
          },
          "params": {
            "type": "object",
            "additionalProperties": {
              "oneOf": [
                {
                  "type": "string"
                },
                {
                  "type": "number"
                },
                {
                  "type": "boolean"
                }
              ]
            }
          }
        },
        "required": [
          "code",
          "messageKey",
          "params"
        ],
        "examples": [
          {
            "code": "VALIDATION",
            "messageKey": "error.validation",
            "params": {}
          }
        ]
      },
      "Clinic": {
        "type": "object",
        "additionalProperties": false,
        "properties": {
          "id": {
            "type": "integer",
            "minimum": 1
          },
          "name": {
            "type": "string"
          },
          "mode": {
            "type": "string",
            "enum": [
              "network",
              "lite"
            ]
          },
          "timezone": {
            "type": "string",
            "enum": [
              "Asia/Hebron"
