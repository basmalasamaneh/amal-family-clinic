    "/admin/audit": {
      "get": {
        "operationId": "listAdminAudit",
        "tags": [
          "Admin"
        ],
        "x-roles": [
          "admin"
        ],
        "security": [
          {
            "sessionCookie": []
          }
        ],
        "description": "Privacy-safe administrative audit feed. Only explicitly allowlisted admin/auth actions with no patient subject are visible. Unknown and clinical actions are excluded. Actor is an ID, never an email/name; target is only a bounded administrative ID extracted for known admin/device actions. No clinical text, patient IDs, detail JSON, lookup queries, changed field values or credentials. Outcome is derived from the allowlisted event action, not arbitrary detail. Clinic-limited admins see only their clinic and cannot request another clinic; network admins may filter across clinics. Null-clinic events are visible only to network admins. Descending event ID keyset pagination: pass nextBeforeId as beforeId, keeping all filters fixed. New higher-ID events do not shift subsequent pages; this is not a frozen cross-request snapshot. No total count. No-store response. Existing doctor-only /audit is unchanged.",
        "parameters": [
          {
            "in": "query",
            "name": "limit",
            "description": "Page size; default 25, maximum 100.",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 100,
              "default": 25
            }
          },
          {
            "in": "query",
            "name": "beforeId",
            "description": "Exclusive event ID boundary returned as nextBeforeId.",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 2147483647
            }
          },
          {
            "in": "query",
            "name": "clinicId",
            "description": "Exact event clinic, constrained by administrator scope.",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 2147483647
            }
          },
          {
            "in": "query",
            "name": "actorId",
            "description": "Exact recorded actor user ID.",
            "schema": {
              "type": "integer",
              "minimum": 1,
              "maximum": 2147483647
            }
          },
          {
            "in": "query",
            "name": "action",
            "schema": {
              "$ref": "#/components/schemas/AdminAuditAction"
            }
          },
          {
            "in": "query",
            "name": "outcome",
            "schema": {
              "type": "string",
              "enum": [
                "success",
                "denied"
              ]
            }
          },
          {
            "in": "query",
            "name": "from",
            "description": "Inclusive event time, ISO 8601 timestamp with timezone; must precede to.",
            "schema": {
              "type": "string",
              "format": "date-time"
            }
          },
          {
            "in": "query",
            "name": "to",
