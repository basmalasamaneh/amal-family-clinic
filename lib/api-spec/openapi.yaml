              "allowedTransitions": ["full"]
            }
          }
        }
      },
      "ClinicExportAttachment": {
        "description": "Complete versioned clinic portability attachment, not a server-side file or download URL. Includes all eight allowlisted datasets and explicit exclusions. No partial response.",
        "headers": {
          "Content-Disposition": { "schema": { "type": "string" }, "description": "attachment; filename=\"clinic-{id}-export.json\"" },
          "Cache-Control": { "schema": { "type": "string", "enum": ["private, no-store"] } }
        },
        "content": {
          "application/json": {
            "schema": { "$ref": "#/components/schemas/ClinicExport" },
            "example": {
              "manifest": {
                "format": "amal-clinic-export", "schemaVersion": 1, "encoding": "UTF-8",
                "exportedAt": "2026-01-01T00:00:00.000Z", "displayTimezone": "Asia/Hebron", "clinicId": 101,
                "empty": true, "rowCount": 1,
                "includedDatasets": [
                  { "dataset": "clinicSettings", "count": 1, "fields": ["clinic_id", "clinic_name", "city", "booking_method", "slot_minutes", "working_days", "open_time", "close_time", "network_mode", "timezone", "adoption_state", "membership_status", "left_by", "joined_at", "adoption_changed_at", "trial_started_at", "lite_started_at", "full_started_at", "left_at"] },
                  { "dataset": "doctors", "count": 0, "fields": ["doctor_id", "clinic_id", "doctor_name", "specialty"] },
                  { "dataset": "patients", "count": 0, "fields": ["patient_id", "patient_name", "phone", "guardian_name", "guardian_relation", "dob"] },
                  { "dataset": "appointments", "count": 0, "fields": ["appointment_id", "clinic_id", "doctor_id", "patient_id", "booking_method", "status", "duration_minutes", "conflict_state", "cancel_reason", "version", "scheduled_at", "created_at", "updated_at"] },
                  { "dataset": "visits", "count": 0, "fields": ["visit_id", "clinic_id", "doctor_id", "patient_id", "diagnosis_notes", "visit_date"] },
                  { "dataset": "consents", "count": 0, "fields": ["id", "patient_id", "recorded_clinic_id", "level", "given_by", "guardian_name", "guardian_relation", "evidence", "given_at", "withdrawn_at"] },
                  { "dataset": "importBatches", "count": 0, "fields": ["id", "clinic_id", "source_name", "status", "version", "created_at", "committed_at"] },
                  { "dataset": "importProvenance", "count": 0, "fields": ["batch_id", "row_id", "appointment_id", "source_name", "source_event_id", "created_at"] }
                ],
                "excludedDatasets": [
                  { "dataset": "otherClinicData", "reason": "Only the exporting clinic's records; no foreign visits, notes, appointments, doctors, consents or imports." },
                  { "dataset": "unattributedConsents", "reason": "Missing recorded_clinic_id is not inferred from current user assignment." },
                  { "dataset": "unassociatedPatients", "reason": "Only demographics associated through local access, appointments or visits." },
                  { "dataset": "usersAndAuthentication", "reason": "No accounts, password/PIN hashes, sessions, tokens, devices or credentials." },
                  { "dataset": "syncAndOperationReceipts", "reason": "No raw sync payloads, conflicts, request hashes or idempotency receipts." },
                  { "dataset": "importRawAndReviewData", "reason": "No source_payload, staging, report, source hashes, candidate identities or review detail." },
                  { "dataset": "auditLogs", "reason": "Audit data is not a clinic portability dataset." },
                  { "dataset": "seedAndFixtureData", "reason": "No seed tables, fixture keys or source references." },
                  { "dataset": "derivedAndTransientData", "reason": "No alerts, KPI snapshots, notifications, holds, merge candidates or telemetry." }
                ],
                "limits": { "maxRows": 10000, "maxBytes": 8388608, "maxDurationMs": 15000 }
              },
              "datasets": {
                "clinicSettings": [{
                  "clinic_id": 101, "clinic_name": "Synthetic demonstration clinic", "city": "Synthetic city",
                  "booking_method": "scheduled", "slot_minutes": 30, "working_days": [0,1,2,3,4],
                  "open_time": "08:00:00", "close_time": "17:00:00", "network_mode": "lite",
                  "timezone": "Asia/Hebron", "joined_at": "2026-01-01T00:00:00.000Z",
                  "adoption_state": "trial", "membership_status": "active", "left_by": null,
                  "adoption_changed_at": "2026-01-01T00:00:00.000Z",
                  "trial_started_at": "2026-01-01T00:00:00.000Z", "lite_started_at": null,
                  "full_started_at": null, "left_at": null
                }],
                "doctors": [], "patients": [], "appointments": [], "visits": [], "consents": [], "importBatches": [], "importProvenance": []
              }
            }
          }
        }
      },
