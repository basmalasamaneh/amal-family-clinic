<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Amal Network · شبكة أمل</title>
    <meta name="description" content="Amal Network · شبكة أمل — design foundation and UI kit for Amal Family Clinic Group." />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply persisted language/direction/theme before first paint.
      (function () {
        try {
          var l = localStorage.getItem('amal.locale'); var t = localStorage.getItem('amal.theme');
          var h = document.documentElement;
          if (l === 'en') { h.lang = 'en'; h.dir = 'ltr'; }
          if (t === 'dark') { h.dataset.theme = 'dark'; h.classList.add('dark'); }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
