<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>عيادة أمل العائلية</title>
    <meta name="description" content="عيادة أمل العائلية · Amal Family Clinic" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0B5F69" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%icons/apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest-ar.webmanifest" />
    <script>
      // Apply persisted language/direction/theme before first paint.
      (function () {
        try {
          var l = localStorage.getItem('amal.locale'); var t = localStorage.getItem('amal.theme');
          var h = document.documentElement;
          if (l === 'en') { h.lang = 'en'; h.dir = 'ltr'; }
          document.title = window.matchMedia('(max-width: 767px)').matches ? 'AFC' : l === 'en' ? 'Amal Family Clinic' : 'عيادة أمل العائلية';
          if (t === 'dark') { h.dataset.theme = 'dark'; h.classList.add('dark'); }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
